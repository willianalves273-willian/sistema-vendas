<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de Câmera - Sistema de Vendas</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    color: #222;
}

header {
    background: #1f2937;
    color: white;
    padding: 18px;
}

main {
    max-width: 700px;
    margin: 20px auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #ccc;
}

button {
    background: #2563eb;
    color: white;
    border: 0;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 16px;
    margin: 5px;
}

button:disabled {
    background: #999;
}

video {
    width: 100%;
    max-height: 400px;
    background: black;
    border-radius: 10px;
    margin-top: 15px;
}

#resultado {
    margin-top: 20px;
    padding: 15px;
    background: #f3f4f6;
    border-radius: 8px;
    font-size: 18px;
}

.sucesso {
    color: green;
    font-weight: bold;
}

.erro {
    color: red;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
    <h1>Teste de Câmera</h1>
    <p>Sistema de Vendas</p>
</header>

<main>

    <h2>Leitor de produto</h2>

    <p>
        Vamos testar primeiro se o celular consegue abrir a câmera
        e reconhecer o código de barras.
    </p>

    <button onclick="iniciarCamera()">
        📷 Abrir câmera
    </button>

    <button onclick="pararCamera()">
        ⛔ Parar câmera
    </button>

    <video id="camera" autoplay playsinline></video>

    <div id="resultado">
        Aguardando câmera...
    </div>

</main>

<script>

let stream = null;
let lendo = false;

async function iniciarCamera() {

    const resultado = document.getElementById("resultado");
    const video = document.getElementById("camera");

    resultado.innerHTML = "Solicitando acesso à câmera...";

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: {
                    ideal: "environment"
                }
            },
            audio: false
        });

        video.srcObject = stream;

        resultado.innerHTML =
            '<span class="sucesso">✓ Câmera funcionando!</span><br>' +
            'Agora a câmera está aberta.';

        iniciarLeitura();

    } catch (erro) {

        resultado.innerHTML =
            '<span class="erro">✗ Não foi possível abrir a câmera.</span><br><br>' +
            erro.message;
    }
}


function pararCamera() {

    lendo = false;

    if (stream) {

        stream.getTracks().forEach(track => {
            track.stop();
        });

        stream = null;
    }

    document.getElementById("camera").srcObject = null;

    document.getElementById("resultado").innerHTML =
        "Câmera desligada.";
}


async function iniciarLeitura() {

    if (!("BarcodeDetector" in window)) {

        document.getElementById("resultado").innerHTML =
            '<span class="erro">Câmera funcionando, mas este navegador não oferece o leitor automático de código de barras.</span>';

        return;
    }

    const detector = new BarcodeDetector({
        formats: [
            "ean_13",
            "ean_8",
            "upc_a",
            "upc_e",
            "code_128",
            "code_39"
        ]
    });

    lendo = true;

    const video = document.getElementById("camera");

    async function procurar() {

        if (!lendo) return;

        try {

            const codigos = await detector.detect(video);

            if (codigos.length > 0) {

                const codigo = codigos[0].rawValue;

                document.getElementById("resultado").innerHTML =
                    '<span class="sucesso">✓ CÓDIGO ENCONTRADO!</span><br><br>' +
                    '<strong>' + codigo + '</strong>';

                lendo = false;
                return;
            }

        } catch (erro) {
            // continua tentando
        }

        requestAnimationFrame(procurar);
    }

    procurar();
}

</script>

</body>
</html>
